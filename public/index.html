<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alpha Empire Protector</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{min-height:100vh;background:#0c0406;color:#fff;font-family:Arial,'Helvetica Neue',sans-serif;
    overflow-x:hidden;}
  .scene{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;
    background:radial-gradient(circle at 50% 10%,#3a0f14 0%,#1a0608 45%,#0c0406 80%);overflow:hidden;}

  .skyline{position:absolute;bottom:0;left:0;width:100%;height:28vh;z-index:0;opacity:0.9;}

  .petal{position:fixed;top:-20px;width:14px;height:14px;background:#ff6b8a;opacity:0.8;
    border-radius:0 60% 0 60%;animation:fall linear infinite;z-index:1;}
  @keyframes fall{
    0%{transform:translateY(0) rotate(0deg);opacity:0;}
    10%{opacity:0.85;}
    100%{transform:translateY(115vh) rotate(380deg);opacity:0;}
  }

  @keyframes cardIn{ from{opacity:0; transform:translateY(24px) scale(0.97);} to{opacity:1; transform:translateY(0) scale(1);} }
  @keyframes emblemPulse{ 0%,100%{filter:drop-shadow(0 0 22px rgba(255,40,60,0.55));} 50%{filter:drop-shadow(0 0 40px rgba(255,60,90,0.85));} }
  @keyframes titleGlow{ 0%,100%{text-shadow:0 0 22px rgba(255,60,80,0.5);} 50%{text-shadow:0 0 38px rgba(255,80,100,0.85);} }

  .card{position:relative;z-index:2;max-width:460px;width:100%;background:rgba(18,8,10,0.72);
    backdrop-filter:blur(6px);border:1px solid rgba(255,120,140,0.3);border-radius:26px;
    padding:40px 30px;text-align:center;box-shadow:0 0 90px rgba(255,40,60,0.25),0 30px 80px rgba(0,0,0,0.6);
    animation:cardIn 0.6s ease-out;}

  .emblem{width:130px;height:140px;margin:0 auto 20px;animation:emblemPulse 3s ease-in-out infinite;}

  .title{font-size:40px;font-weight:900;letter-spacing:1px;color:#ff4d6a;animation:titleGlow 3s ease-in-out infinite;}
  .subtitle{margin-top:2px;font-size:20px;font-weight:800;letter-spacing:10px;color:#fff;text-transform:uppercase;}

  .credit{margin-top:22px;font-size:13px;color:#ccc;line-height:1.6;}
  .credit b{color:#ff8a9c;}

  .box{margin-top:22px;background:#0a0304;border:1px solid rgba(255,120,140,0.3);border-radius:14px;
    padding:16px;font-family:monospace;font-size:12px;color:#ddd;word-break:break-all;text-align:left;}

  .copybtn{margin-top:18px;width:100%;padding:15px;border:none;border-radius:14px;font-weight:900;font-size:15px;
    letter-spacing:1px;cursor:pointer;text-transform:uppercase;color:#fff;
    background:linear-gradient(135deg,#ff4d6a,#b3122e);box-shadow:0 10px 30px rgba(255,40,60,0.35);
    transition:transform 0.15s ease, box-shadow 0.15s ease;}
  .copybtn:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(255,40,60,0.55);}
  .copybtn:active{transform:translateY(0);}

  .status{margin-top:12px;font-size:12px;color:#ff9aa8;min-height:16px;font-weight:700;}

  .foot{margin-top:22px;font-size:11px;color:#999;letter-spacing:3px;text-transform:uppercase;}
</style></head>
<body>
<div class="scene">
  <svg class="skyline" viewBox="0 0 1000 200" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="1000" height="200" fill="none"/>
    <path d="M0,200 L0,140 L50,140 L50,110 L90,110 L90,150 L140,150 L140,100 L170,100 L170,160 L230,160 L230,120 L270,120 L270,170 L330,170 L330,90 L370,90 L370,160 L440,160 L440,130 L480,130 L480,180 L560,180 L560,110 L610,110 L610,170 L680,170 L680,120 L730,120 L730,190 L820,190 L820,140 L870,140 L870,180 L1000,180 L1000,200 Z" fill="#1a0608" opacity="0.9"/>
  </svg>
  <div class="petal" style="left:6%;  animation-duration:7s;  animation-delay:0s;"></div>
  <div class="petal" style="left:18%; animation-duration:9s;  animation-delay:1.2s; width:10px;height:10px;"></div>
  <div class="petal" style="left:32%; animation-duration:6.5s;animation-delay:2.4s;"></div>
  <div class="petal" style="left:48%; animation-duration:8s;  animation-delay:0.6s; width:9px;height:9px;"></div>
  <div class="petal" style="left:62%; animation-duration:7.5s;animation-delay:1.8s;"></div>
  <div class="petal" style="left:75%; animation-duration:9.5s;animation-delay:0.3s; width:11px;height:11px;"></div>
  <div class="petal" style="left:88%; animation-duration:6.8s;animation-delay:2.1s;"></div>
  <div class="petal" style="left:95%; animation-duration:8.6s;animation-delay:1.0s; width:10px;height:10px;"></div>

  <div class="card">
    <svg class="emblem" viewBox="0 0 130 140" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ff4d6a"/>
          <stop offset="100%" stop-color="#6e0f1f"/>
        </linearGradient>
      </defs>
      <polygon points="65,6 110,46 100,110 65,134 30,110 20,46" fill="#160608" stroke="url(#g1)" stroke-width="4"/>
      <polygon points="65,26 92,50 85,98 65,114 45,98 38,50" fill="url(#g1)" opacity="0.85"/>
      <polygon points="65,40 78,54 73,86 65,96 57,86 52,54" fill="#160608"/>
      <polygon points="8,70 30,46 36,52 16,76" fill="url(#g1)"/>
      <polygon points="122,70 100,46 94,52 114,76" fill="url(#g1)"/>
    </svg>

    <div class="title">ALPHA EMPIRE</div>
    <div class="subtitle">Protector</div>

    <div class="credit">
      This script is protected by <b>Alpha Empire</b><br>
      Made by <b>AAYAN</b> &mdash; AAYANZZ PAPA KI SCRIPT chori karne ki koshish mat kar, betee.
    </div>

    <div class="box" id="loadstringBox">loadstring(game:HttpGet("LOADSTRING_URL"))()</div>
    <button class="copybtn" id="copyBtn">Copy Script</button>
    <div class="status" id="status"></div>

    <div class="foot">Alpha Empire &bull; Aayanzz Edition</div>
  </div>
</div>
<script>
  const statusEl = document.getElementById('status');
  const box = document.getElementById('loadstringBox');
  const origin = window.location.origin;
  const currentLine = `loadstring(game:HttpGet("${origin}/load"))()`;
  box.textContent = currentLine;

  document.getElementById('copyBtn').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(currentLine);
      statusEl.textContent = 'Copied! Paste in your executor.';
    } catch (e) {
      statusEl.textContent = 'Copy failed, select the box text manually.';
    }
  });
</script>
</body></html>
